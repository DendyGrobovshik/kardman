name: release

# CI is the single writer of the changelog (compatibility.md §2.1, §9). This workflow runs the
# release in its commit order — tests → prepare → build → contract tests → commit — and then
# persists the result: the release state (changelog, polyfills.json, plugin releases,
# snapshots) is committed back to the branch, and the store bundles are uploaded.
#
#   gh workflow run release.yml \
#     -f command=dynamic-release \
#     -f analysisJson=tests/stand/kernel/internal/build/generated/rdma/kernel_manifest_android.json \
#     -f versionsDir=versions \
#     -f internalModules=internal \
#     -f contractApp=:tests:stand:androidApp
#
# Secrets: RDMA_SIGNING_KEY — the Ed25519 release key (`commit-release` signs every bundle).

on:
  workflow_dispatch:
    inputs:
      command:
        description: "static-release | dynamic-release | hotfix-release | plugin-release"
        required: true
        default: "dynamic-release"
      analysisJson:
        description: "Kernel analyses, comma-separated (android,ios); for plugin-release: the plugin.json"
        required: true
      versionsDir:
        description: "Directory holding the release state (changelog.json, polyfills.json, bundles/)"
        required: true
        default: "versions"
      internalModules:
        description: "Comma-separated framework-owned module ids"
        required: false
        default: "internal"
      telemetryFile:
        description: "Optional host-version telemetry for the coverage warning"
        required: false
      contractApp:
        description: "App Gradle path whose instrumented tests run the kernel contract tests (empty: skip)"
        required: false
        default: ""
      pluginBundles:
        description: "plugin-release only: <generation>=<bundle.hbc> pairs, comma-separated"
        required: false
        default: ""
      dryRun:
        description: "Run every check and write nothing"
        required: false
        default: "false"

# One release at a time: two releases racing on the changelog would both read the same head.
concurrency:
  group: rdma-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM (Android emulator)
        if: github.event.inputs.contractApp != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kernel release (tests → prepare → build → commit)
        if: github.event.inputs.command != 'plugin-release' && github.event.inputs.contractApp == ''
        env:
          DRY_RUN: ${{ github.event.inputs.dryRun == 'true' && '1' || '0' }}
          RDMA_SIGNING_KEY: ${{ secrets.RDMA_SIGNING_KEY }}
        run: |
          ./scripts/release.sh \
            "${{ github.event.inputs.command }}" \
            "${{ github.event.inputs.analysisJson }}" \
            "${{ github.event.inputs.versionsDir }}" \
            build/rdma-release \
            "${{ github.event.inputs.internalModules }}" \
            "${{ github.event.inputs.telemetryFile }}"

      - name: Kernel release with contract tests on an emulator
        if: github.event.inputs.command != 'plugin-release' && github.event.inputs.contractApp != ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DRY_RUN: ${{ github.event.inputs.dryRun == 'true' && '1' || '0' }}
          RDMA_SIGNING_KEY: ${{ secrets.RDMA_SIGNING_KEY }}
          RDMA_CONTRACT_APP: ${{ github.event.inputs.contractApp }}
        with:
          api-level: 34
          arch: x86_64
          script: >-
            ./scripts/release.sh
            "${{ github.event.inputs.command }}"
            "${{ github.event.inputs.analysisJson }}"
            "${{ github.event.inputs.versionsDir }}"
            build/rdma-release
            "${{ github.event.inputs.internalModules }}"
            "${{ github.event.inputs.telemetryFile }}"

      - name: Plugin release
        if: github.event.inputs.command == 'plugin-release' && github.event.inputs.dryRun != 'true'
        env:
          RDMA_SIGNING_KEY: ${{ secrets.RDMA_SIGNING_KEY }}
        run: |
          ./gradlew :rdma-kernel-compiler-plugin:pluginRelease \
            -PpluginJson="${{ github.event.inputs.analysisJson }}" \
            -PversionsDir="${{ github.event.inputs.versionsDir }}" \
            -PgenerationBundles="${{ github.event.inputs.pluginBundles }}"

      - name: Persist the release state
        if: github.event.inputs.dryRun != 'true'
        run: |
          dir="${{ github.event.inputs.versionsDir }}"
          git config user.name "rdma-release"
          git config user.email "rdma-release@users.noreply.github.com"
          # The bundles go to the store (artifact below), the state stays with the code.
          git add "$dir" ':!'"$dir"'/bundles'
          if git diff --cached --quiet; then
            echo "no release state changes"
          else
            git commit -m "release: ${{ github.event.inputs.command }} (${{ github.run_id }})"
            git push
          fi

      - name: Upload store bundles
        if: github.event.inputs.dryRun != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rdma-bundles-${{ github.run_id }}
          path: ${{ github.event.inputs.versionsDir }}/bundles
          if-no-files-found: ignore
