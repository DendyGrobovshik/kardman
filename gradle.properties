#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#RDMA
# Single source of truth for the user-side modules. Consumed by the gradle/compiler
# plugins and the app plugin. `rdmaKernelProject`/`rdmaPluginProject` are the container
# project paths; per-module packages are derived from each submodule's path (the part
# after the container path) prefixed with the root package. `rdmaKernelInternals` lists
# the kernel submodules that are framework-owned (standard functionality).
rdmaKernelRootPackage=com.example.kernel
rdmaPluginRootPackage=com.example.plugin
rdmaKernelProject=:kernel
rdmaPluginProject=:plugin
rdmaKernelInternals=:kernel:internal
# AOT-compile the plugin JS to Hermes bytecode (.hbc) at build time.
rdmaHermesc=tools/hermesc