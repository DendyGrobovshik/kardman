#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#RDMA
# Single source of truth for the user-side modules. Consumed by the gradle/compiler
# plugins and the app plugin. `rdmaKernelProject`/`rdmaPluginProject` are Gradle
# project paths; `rdmaKernelPackage` is the package of the @RDMA classes/widgets.
rdmaKernelPackage=com.example.kernel
rdmaKernelProject=:kernel
rdmaPluginProject=:plugin